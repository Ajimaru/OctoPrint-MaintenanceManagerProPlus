# Categories for GitHub's generated release notes. A pull request lands in the
# first category whose labels it carries, so the order matters. A category only
# matches if its labels exist on the repository; "*" catches unlabelled PRs.
changelog:
  categories:
    - title: "⚠️ Breaking Changes"
      labels: ["breaking"]
    - title: "🔒 Security"
      labels: ["security"]
    - title: "✨ New Features"
      labels: ["enhancement", "feature"]
    - title: "🐛 Bug Fixes"
      labels: ["bug", "fix"]
    - title: "♿ Accessibility"
      labels: ["accessibility"]
    - title: "⚡ Performance"
      labels: ["performance"]
    - title: "♻️ Refactoring"
      labels: ["refactor"]
    - title: "📚 Documentation"
      labels: ["documentation"]
    - title: "🧪 Tests"
      labels: ["test"]
    - title: "📦 Dependencies"
      labels: ["dependencies", "depfu"]
    - title: "🔧 CI / Tooling"
      labels: ["ci", "tooling", "chore", "github_actions"]
    - title: "🧩 Other Changes"
      labels: ["*"]
  exclude:
    labels: ["skip-changelog"]
