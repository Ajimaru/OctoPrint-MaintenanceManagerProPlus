name: CI

# No test suite yet: checks that the plugin builds, installs and loads on both
# OctoPrint generations, and that the JavaScript parses.
on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Build & load (OctoPrint ${{ matrix.label }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.runner || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # ubuntu-latest has no Python 3.9 any more.
          - label: "1.x"
            python: "3.9"
            runner: ubuntu-24.04
            octoprint: "OctoPrint>=1.11,<2"
          - label: "2.x"
            python: "3.13"
            octoprint: "OctoPrint>=2,<3"

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - name: Install OctoPrint
        run: |
          python -m pip install --upgrade pip build setuptools wheel
          python -m pip install "${{ matrix.octoprint }}"

      # setup.py imports octoprint_setuptools, so the build needs OctoPrint
      # from this environment instead of an isolated one.
      - name: Build sdist and wheel
        run: python -m build --no-isolation

      - name: Install the wheel
        run: python -m pip install dist/*.whl

      # Runs outside the checkout so the installed package is imported.
      - name: Load the plugin
        working-directory: ${{ runner.temp }}
        run: |
          python - <<'PY'
          import os
          import octoprint_MaintenanceManagerProPlus as plugin

          plugin.__plugin_load__()
          impl = plugin.__plugin_implementation__
          base = os.path.dirname(plugin.__file__)
          for kind, files in impl.get_assets().items():
              for name in files:
                  assert os.path.isfile(os.path.join(base, "static", name)), name
          assert os.path.isdir(os.path.join(base, "templates"))
          print("loaded", type(impl).__name__, "with hooks", sorted(plugin.__plugin_hooks__))
          PY

      - name: Check JavaScript syntax
        run: |
          for f in octoprint_MaintenanceManagerProPlus/static/js/*.js; do
            node --check "$f"
          done
