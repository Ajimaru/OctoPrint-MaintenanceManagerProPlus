name: Tag pushed - prepare release

# Globs, not regex: matches 1.0.0, 1.0.0rc1, 1.0.0.dev1, with or without "v".
on:
  push:
    tags:
      - "[0-9]*.[0-9]*.[0-9]*"
      - "v[0-9]*.[0-9]*.[0-9]*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build & draft release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # release notes diff against the previous tag

      - name: Check tag against plugin_version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VERSION=$(grep '^plugin_version' setup.py | cut -d '"' -f2)
          echo "setup.py: $VERSION, tag: $TAG"
          if [ "$VERSION" != "${TAG#v}" ]; then
            echo "::error::plugin_version in setup.py ($VERSION) does not match the tag ($TAG)"
            exit 1
          fi

      # PEP 440 pre-release or dev segment; the local part (+...) is cut off first.
      - name: Determine prerelease
        id: prerelease
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="$(printf '%s' "${TAG#v}" | tr '[:upper:]' '[:lower:]')"
          VERSION="${VERSION%%+*}"
          if echo "$VERSION" | grep -qE '(^|[-._0-9])(a|b|rc|dev|alpha|beta)([._-]?[0-9]+)?$'; then
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      # master.zip is the asset the plugin's software update downloads
      # (get_update_information); keep both names in sync.
      - name: Build plugin archive
        run: |
          set -euo pipefail
          git archive --format=zip -o master.zip HEAD \
            octoprint_MaintenanceManagerProPlus setup.py setup.cfg MANIFEST.in requirements.txt README.md LICENSE
          unzip -l master.zip

      - name: Check that the archive installs
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install "OctoPrint>=2,<3"
          python -m pip install --no-build-isolation ./master.zip

      # Always a draft: a release is published by hand after a review.
      - name: Create release draft
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          IS_PRERELEASE: ${{ steps.prerelease.outputs.is_prerelease }}
        run: |
          set -euo pipefail
          FLAGS=(--draft --generate-notes --verify-tag --title "Version $TAG (draft)")
          if [ "$IS_PRERELEASE" = "true" ]; then
            FLAGS+=(--prerelease)
          fi
          gh release create "$TAG" "${FLAGS[@]}" master.zip
