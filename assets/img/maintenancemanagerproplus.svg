<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="MaintenanceManagerProPlus plugin icon">
  <title>MaintenanceManagerProPlus</title>
  <defs>
    <radialGradient id="bg-grad" cx="30%" cy="70%" r="85%">
      <stop offset="0%" stop-color="#161c23"/>
      <stop offset="55%" stop-color="#080a0d"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>

    <radialGradient id="core-glow" gradientUnits="userSpaceOnUse" cx="27" cy="31" r="24">
      <stop offset="0%" stop-color="#6fb7ff" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#6fb7ff" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="zone-ok" gradientUnits="userSpaceOnUse" x1="11.4" y1="40" x2="18.5" y2="15.1">
      <stop offset="0%" stop-color="#1f9a2e"/>
      <stop offset="100%" stop-color="#5cf06a"/>
    </linearGradient>
    <linearGradient id="zone-soon" gradientUnits="userSpaceOnUse" x1="20.3" y1="14.3" x2="39" y2="17.6">
      <stop offset="0%" stop-color="#ffd27a"/>
      <stop offset="100%" stop-color="#ff9a2e"/>
    </linearGradient>
    <linearGradient id="zone-due" gradientUnits="userSpaceOnUse" x1="40.4" y1="19" x2="42.6" y2="40">
      <stop offset="0%" stop-color="#ff6a55"/>
      <stop offset="100%" stop-color="#b3261a"/>
    </linearGradient>

    <linearGradient id="wheel-grad" gradientUnits="userSpaceOnUse" x1="32" y1="38" x2="37" y2="46">
      <stop offset="0%" stop-color="#5cb0ff"/>
      <stop offset="55%" stop-color="#3a8dff"/>
      <stop offset="100%" stop-color="#123a80"/>
    </linearGradient>

    <filter id="soft-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Black backdrop -->
  <rect x="0" y="0" width="64" height="64" rx="13" fill="url(#bg-grad)"/>
  <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="12.25" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1.5"/>
  <circle cx="27" cy="31" r="24" fill="url(#core-glow)"/>

  <!-- Gauge zones: ok, due soon, due -->
  <g fill="none" stroke-width="4.5" filter="url(#soft-glow)">
    <path d="M11.412 40 A18 18 0 0 1 18.549 15.107" stroke="url(#zone-ok)"/>
    <path d="M20.257 14.31 A18 18 0 0 1 39.044 17.624" stroke="url(#zone-soon)"/>
    <path d="M40.376 18.956 A18 18 0 0 1 42.588 40" stroke="url(#zone-due)"/>
  </g>

  <!-- Scale ticks -->
  <g stroke="#cfe4ff" stroke-linecap="round">
    <g stroke-opacity="0.7" stroke-width="1.4">
      <line x1="27" y1="16.6" x2="27" y2="19.4" transform="rotate(-120 27 31)"/>
      <line x1="27" y1="16.6" x2="27" y2="19.4" transform="rotate(-60 27 31)"/>
      <line x1="27" y1="16.6" x2="27" y2="19.4"/>
      <line x1="27" y1="16.6" x2="27" y2="19.4" transform="rotate(60 27 31)"/>
      <line x1="27" y1="16.6" x2="27" y2="19.4" transform="rotate(120 27 31)"/>
    </g>
    <g stroke-opacity="0.4" stroke-width="1">
      <line x1="27" y1="16.6" x2="27" y2="18.4" transform="rotate(-90 27 31)"/>
      <line x1="27" y1="16.6" x2="27" y2="18.4" transform="rotate(-30 27 31)"/>
      <line x1="27" y1="16.6" x2="27" y2="18.4" transform="rotate(30 27 31)"/>
      <line x1="27" y1="16.6" x2="27" y2="18.4" transform="rotate(90 27 31)"/>
    </g>
  </g>

  <!-- Needle in the "due soon" zone -->
  <g filter="url(#soft-glow)">
    <path d="M27 17.5 L28.6 31 L27 34.6 L25.4 31 Z" fill="#e8f1ff" transform="rotate(40 27 31)"/>
    <circle cx="27" cy="31" r="3.1" fill="#05070a"/>
    <circle cx="27" cy="31" r="3.1" fill="none" stroke="#cfe4ff" stroke-opacity="0.55" stroke-width="1"/>
    <circle cx="27" cy="31" r="1.3" fill="#e8f1ff"/>
  </g>

  <!-- Odometer counter -->
  <rect x="17" y="38" width="20" height="8" rx="1.6" fill="#05070a"/>
  <path d="M32 38 H35.4 A1.6 1.6 0 0 1 37 39.6 V44.4 A1.6 1.6 0 0 1 35.4 46 H32 Z" fill="url(#wheel-grad)"/>
  <g stroke="#3a8dff" stroke-opacity="0.35" stroke-width="0.6">
    <line x1="22" y1="38.8" x2="22" y2="45.2"/>
    <line x1="27" y1="38.8" x2="27" y2="45.2"/>
  </g>
  <rect x="17" y="38" width="20" height="8" rx="1.6" fill="none" stroke="#3a8dff" stroke-opacity="0.55" stroke-width="1"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="6.2" font-weight="bold" text-anchor="middle">
    <text x="19.5" y="44.2" fill="#cfe4ff">0</text>
    <text x="24.5" y="44.2" fill="#cfe4ff">7</text>
    <text x="29.5" y="44.2" fill="#cfe4ff">4</text>
    <text x="34.5" y="44.2" fill="#ffffff">2</text>
  </g>

  <!-- Maintenance badge: wrench -->
  <circle cx="49" cy="49" r="12" fill="#05070a"/>
  <g filter="url(#soft-glow)">
    <circle cx="49" cy="49" r="10" fill="#05070a"/>
    <circle cx="49" cy="49" r="10" fill="none" stroke="#a8d6ff" stroke-opacity="0.75" stroke-width="1.8"/>
    <g transform="translate(49 49) rotate(-45)" fill="#cfe4ff">
      <path d="M6.386 -1.15 A3.2 3.2 0 1 0 6.386 1.15 L3.6 1.15 A1.15 1.15 0 0 1 3.6 -1.15 Z"/>
      <rect x="-6.6" y="-1.3" width="8.6" height="2.6" rx="1.3"/>
      <circle cx="-5" cy="0" r="0.75" fill="#05070a"/>
    </g>
  </g>
</svg>
